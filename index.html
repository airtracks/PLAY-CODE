<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>픽셀 RPG — 레트로 어드벤처</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="screen">
    <canvas id="c"></canvas>
    <div id="mobile-controls">
      <div class="dpad">
        <button class="dpad-btn" data-dir="up">▲</button>
        <div class="dpad-mid">
          <button class="dpad-btn" data-dir="left">◄</button>
          <div class="dpad-center"></div>
          <button class="dpad-btn" data-dir="right">►</button>
        </div>
        <button class="dpad-btn" data-dir="down">▼</button>
      </div>
      <div class="action-btns">
        <button id="btn-b">B</button>
        <button id="btn-a">A</button>
      </div>
    </div>
    <div id="hint">방향키로 이동 · A/Space/Enter = 확인 · Esc = 메뉴</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
